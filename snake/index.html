<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <link rel="icon" type="image/png" href="./snake.png" />
    <link rel="stylesheet" href="../assets/css/shared.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="header-content">
          <a href="../index.html" class="back-button" aria-label="Volver al menú principal">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
          </a>
          <div>
            <h1>Snake</h1>
            <p class="subtitle">Crece sin chocarte</p>
          </div>
        </div>
      </header>

      <div class="score-bar">
        <div class="score-block">
          <span class="score-label">Puntos</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-block">
          <span class="score-label">Record</span>
          <span class="score-value" id="highScore">0</span>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
        <div class="pause-overlay hidden" id="pauseOverlay">
          <span class="pause-text">PAUSADO</span>
        </div>
      </div>

      <div class="controls-row">
        <button class="btn" id="startBtn">Comenzar</button>
        <button class="btn" id="pauseBtn" disabled>Pausa</button>
        <button class="btn secondary" id="resetBtn">Reiniciar</button>
      </div>

      <div class="dpad" id="dpad">
        <button class="dpad-btn" data-dir="up" aria-label="Arriba">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
        </button>
        <button class="dpad-btn" data-dir="left" aria-label="Izquierda">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="dpad-center"></div>
        <button class="dpad-btn" data-dir="right" aria-label="Derecha">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button class="dpad-btn" data-dir="down" aria-label="Abajo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>

      <p class="tip">Flechas del teclado o botones para moverte · <kbd>Espacio</kbd> para pausar</p>

      <div id="gameOver" class="game-over hidden">
        <div class="game-over-content">
          <button class="go-close" id="goClose" aria-label="Cerrar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
          <h2>Game Over</h2>
          <p class="go-score">Puntuación: <span id="finalScore">0</span></p>
          <p class="go-hs" id="goHighScore">¡Nuevo récord!</p>
          <button id="playAgainBtn" class="btn">Jugar de nuevo</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
